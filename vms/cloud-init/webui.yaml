#cloud-config
hostname: webui
manage_etc_hosts: true
ssh_pwauth: false
disable_root: true
write_files:
  - path: /etc/ssh/sshd_config
    owner: root:root
    permissions: "0644"
    content: |
      UsePAM yes
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      Include /etc/ssh/sshd_config.d/*.conf
      Subsystem sftp internal-sftp
users:
  - name: ansible
    groups: [sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICLPYWxCTckCVdDiBpiKWE8omDndrvQhWkscX8uIyd1j
package_update: true
packages:
  - openssh-server
  - python3
  - sudo-rs
