- name: CPU inference through llama-swap
  hosts: llm_server
  become: true
  tasks:
    # 推論設定とモデルの保存先ディレクトリ作成
    - name: Model and configuration directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - /etc/llama-swap
        - /srv/llama-swap/models

    # llama-swapの設定ファイル配置
    - name: On-demand model settings
      ansible.builtin.template:
        src: llama-swap.yaml.j2
        dest: /etc/llama-swap/config.yaml
        mode: "0600"
      notify: Restart llama-swap

    # CPU推論コンテナのサービスファイル配置
    - name: CPU inference Quadlet
      ansible.builtin.template:
        src: llama-swap.container.j2
        dest: /etc/containers/systemd/llama-swap.container
        mode: "0644"
      notify: Restart llama-swap

    # llama-swapコンテナの起動
    - name: Start llama-swap
      ansible.builtin.systemd_service:
        name: llama-swap
        state: started
        daemon_reload: true

    # handlerの実行
    - name: Apply inference configuration
      ansible.builtin.meta: flush_handlers

    # 推論サービスのヘルスチェック
    - name: Local inference API readiness
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ llm_listen_port }}/health"
        use_proxy: false
      register: llm_health
      until: llm_health.status | default(0) == 200
      retries: 60
      delay: 5

  handlers:
    # llama-swapコンテナの再起動
    - name: Restart llama-swap
      ansible.builtin.systemd_service:
        name: llama-swap
        state: restarted
        daemon_reload: true
